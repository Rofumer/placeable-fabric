# Per-version overrides for Minecraft 26.1.2.
#
# 26.1.2 is the first 26.x series version supported by this mod.
# Key ecosystem changes vs. 1.21.x:
#   - Yarn mappings discontinued; Loom uses Mojang official mappings
#     (loom.officialMojangMappings()). The absence of a yarn_mappings
#     property is the signal build.gradle.kts uses to switch mapping
#     strategies.
#   - Java 25 required (build.gradle.kts detects version >=26).
#   - Fabric Loader 0.19.x, Fabric API 0.149.x.
#   - Cloth Config 26.1.x, ModMenu 18.x.
#
# NOTE: No yarn_mappings property here — intentional.
# build.gradle.kts falls back to loom.officialMojangMappings() when
# yarn_mappings is absent.
minecraft=26.1.2
fabric_loader=0.19.2
fabric_api=0.149.1+26.1.2
cloth_config=26.1.154
modmenu=18.0.0-beta.1
# Covers 26.1.2 and any future 26.1.x hotfixes. The <26.2 ceiling
# ensures the jar is not loaded on the next 26.2.x drop, which may
# introduce new or renamed plant blocks.
minecraft_dep=>=26.1.2- <26.2
