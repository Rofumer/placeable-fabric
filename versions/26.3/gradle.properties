# Per-version overrides for Minecraft 26.3.
#
# Third 26.x series version supported by this mod (after 26.1.2 and 26.2).
# Ecosystem notes (same shape as 26.1.2 / 26.2):
#   - Yarn mappings discontinued; the game ships non-obfuscated, so Loom
#     gets a Tiny v2 identity mapping JAR (see identity-mappings.jar and
#     the >=26 branch in build.gradle.kts).
#   - Java 25 required (build.gradle.kts detects version >=26).
#   - Fabric Loader 0.19.x, Fabric API 0.162.x+26.3.
#   - Cloth Config 26.3.x, ModMenu 21.x.
#
# NOTE: No yarn_mappings property here — intentional.
minecraft=26.3
fabric_loader=0.19.5
fabric_api=0.162.0+26.3
cloth_config=26.3.159
modmenu=21.0.0
# Covers 26.3 and any future 26.3.x hotfixes. The <26.4 ceiling ensures the
# jar is not loaded on the next 26.4 drop, which may introduce new or renamed
# plant blocks.
minecraft_dep=>=26.3- <26.4
