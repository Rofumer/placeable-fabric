# Per-version overrides for Minecraft 26.2.
#
# Second 26.x series version supported by this mod (after 26.1.2).
# Ecosystem notes (same shape as 26.1.2):
#   - Yarn mappings discontinued; the game ships non-obfuscated, so Loom
#     gets a Tiny v2 identity mapping JAR (see identity-mappings.jar and
#     the >=26 branch in build.gradle.kts).
#   - Java 25 required (build.gradle.kts detects version >=26).
#   - Fabric Loader 0.19.x, Fabric API 0.158.x+26.2.
#   - Cloth Config 26.2.x, ModMenu 20.x.
#
# NOTE: No yarn_mappings property here — intentional.
minecraft=26.2
fabric_loader=0.19.3
fabric_api=0.158.0+26.2
cloth_config=26.2.155
modmenu=20.0.1
# Covers 26.2 and any future 26.2.x hotfixes. The <26.3 ceiling ensures the
# jar is not loaded on the next 26.3 drop, which may introduce new or renamed
# plant blocks.
minecraft_dep=>=26.2- <26.3
